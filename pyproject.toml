[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-detection"
version = "0.3.0"
description = "Classroom behavior detection with YOLOv8, a React workspace and a local FastAPI server."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohammed Fakir", email = "mr.fakir.mohammed@gmail.com" }]
dependencies = [
    "ultralytics>=8.3",
    "albumentations>=2.0",
    "opencv-python>=4.8",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
app = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pillow>=10", "imageio-ffmpeg>=0.5"]
dev = ["pytest", "httpx>=0.27"]

[project.scripts]
behavior-detection = "behavior_detection.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
